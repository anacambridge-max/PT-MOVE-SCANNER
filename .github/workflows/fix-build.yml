name: Fix dashboard build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix TypeScript boolean narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "good={pattern.top.dailyLocation?.includes('BASE')}"
          new = "good={!!pattern.top.dailyLocation?.includes('BASE')}"
          if old not in s:
              raise SystemExit('Target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m "Fix dashboard TypeScript boolean type"
          git push
